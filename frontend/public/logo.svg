<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7edeab;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wallet card icon -->
  <rect x="5" y="12" width="42" height="34" rx="6" fill="url(#spGrad)" stroke="#0d4a28" stroke-width="2"/>
  <!-- Gold chip -->
  <rect x="10" y="18" width="10" height="6" rx="1.5" fill="#ffd700" opacity="0.9"/>
  <!-- Network dots -->
  <circle cx="40" cy="35" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="40" cy="35" r="1.5" fill="white"/>
  <!-- Card lines -->
  <line x1="24" y1="22" x2="40" y2="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="27" x2="36" y2="27" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="58" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" letter-spacing="0.5">Simple</text>
  <text x="58" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1a6b3c" letter-spacing="0.5">Pay</text>
  <!-- Tagline -->
  <text x="58" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="7" fill="#888" letter-spacing="1">UNIFIED PAYMENTS</text>
</svg>